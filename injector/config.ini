; ZB2 Menu Injector — config externa (edite sem recompilar).
; Linhas com ; ou # sao comentarios. Secoes [...] sao ignoradas (legibilidade).

[Target]
; Nome do processo alvo (comparacao case-insensitive).
process=ZumbiBlocks2.exe
; DLL: caminho literal (absoluto ou relativo ao exe) OU so o nome do arquivo
; (procura ao lado do injetor, build\Release_x64 e caminho dev).
dll=D:\Projeto\ZB2 Menu\build\Release_x64\kiero-dx11-base.dll
; Segundos aguardando o processo aparecer (polling 1s).
timeout=120

[Inject]
; Tentativas de injecao antes de desistir.
retry=3
; Espera entre tentativas (s).
retry_delay=5
; Espera antes da 1a tentativa (jogo termina o bootstrap) (s).
bootstrap_delay=3
